<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>ExpertBot Live</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="logo">🤖</span>
        <span class="name">Expert<span class="accent">Bot</span> Live</span>
      </div>
      <div class="status">
        <span id="eo-status" class="badge warn">Expert Option: غير متصل</span>
        <span id="bot-status" class="badge">البوت: متوقف</span>
        <span id="token-status" class="badge">جارٍ البحث عن التوكن…</span>
      </div>
    </header>

    <main id="main">
      <!-- يمين: Expert Option -->
      <div id="eo-panel">
        <div id="eo-header">Expert Option — سجّل دخولك هنا</div>
        <webview
          id="eo-webview"
          src="https://app.expertoption.com/"
          allowpopups
          disablewebsecurity
          plugins
          partition="persist:expertoption"
        ></webview>
      </div>

      <!-- يسار: البوت -->
      <div id="bot-panel">
        <div id="bot-header">لوحة تحكم البوت</div>
        <webview
          id="bot-webview"
          src="about:blank"
          allowpopups
          disablewebsecurity
          partition="persist:bot"
        ></webview>
      </div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>

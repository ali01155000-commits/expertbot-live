<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://app.expertoption.com https://*.expertoption.com data:" />
  <title>ExpertBot Live</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar: logo + bot status + controls -->
    <header id="topbar">
      <div class="brand">
        <span class="logo">🤖</span>
        <span class="name">Expert<span class="accent">Bot</span> Live</span>
      </div>
      <div class="status">
        <span id="eo-status" class="badge warn">غير متصل</span>
        <span id="bot-status" class="badge">البوت متوقف</span>
        <span id="balance" class="badge emerald">الرصيد: —</span>
      </div>
      <div class="controls">
        <button id="btn-reload" title="إعادة تحميل Expert Option">↻</button>
        <button id="btn-toggle-panel" title="إظهار/إخفاء لوحة البوت">⚙</button>
      </div>
    </header>

    <!-- Main split: webview (left) + bot panel (right, collapsible) -->
    <main id="main">
      <!-- Embedded Expert Option (the "browser inside the bot") -->
      <div id="webview-wrap">
        <webview
          id="eo-webview"
          src="https://app.expertoption.com/"
          allowpopups
          disablewebsecurity
          plugins
          preload="./inject.js"
          partition="persist:expertoption"
        ></webview>
        <div id="loading-overlay">
          <div class="spinner"></div>
          <p>جارٍ تحميل منصة Expert Option…</p>
        </div>
      </div>

      <!-- Bot panel (overlay on the right) -->
      <aside id="bot-panel">
        <h2>لوحة تحكم البوت</h2>

        <div class="field">
          <label>الإستراتيجية</label>
          <select id="strategy">
            <option value="trend">متابعة الاتجاه</option>
            <option value="rsi">مؤشر RSI</option>
            <option value="ma_cross">تقاطع المتوسطات</option>
            <option value="alligator">Alligator</option>
          </select>
        </div>

        <div class="field">
          <label>قيمة الرهان ($)</label>
          <input id="amount" type="number" min="1" value="10" />
        </div>

        <div class="field">
          <label>مدة الصفقة (ثانية)</label>
          <select id="expiry">
            <option value="15">15 ثانية</option>
            <option value="30" selected>30 ثانية</option>
            <option value="60">60 ثانية</option>
            <option value="120">2 دقيقة</option>
            <option value="300">5 دقائق</option>
          </select>
        </div>

        <div class="field">
          <label>أقصى عدد صفقات (0 = لا حد)</label>
          <input id="max-trades" type="number" min="0" value="0" />
        </div>

        <div class="field checkbox">
          <input id="martingale" type="checkbox" />
          <label for="martingale">مارتينجال (مضاعفة بعد الخسارة)</label>
        </div>

        <button id="btn-start" class="btn-start">▶ تشغيل البوت</button>
        <button id="btn-stop" class="btn-stop hidden">■ إيقاف البوت</button>

        <div class="manual-row">
          <button id="btn-call" class="btn-call">▲ شراء CALL</button>
          <button id="btn-put" class="btn-put">▼ بيع PUT</button>
        </div>

        <div class="stats">
          <div><span>صفقات البوت:</span> <span id="stat-trades">0</span></div>
          <div><span>صافي الربح:</span> <span id="stat-pnl">0.00$</span></div>
        </div>

        <div class="log-wrap">
          <div class="log-header">سجل النشاط</div>
          <div id="log"></div>
        </div>
      </aside>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      width: 340px;
      background: #0a0e14;
      color: #e4e4e7;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .logo { font-size: 24px; }
    .title { font-size: 16px; font-weight: 700; }
    .accent { color: #10b981; }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status.connected { background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .status.disconnected { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.green { background: #10b981; }
    .dot.red { background: #ef4444; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; color: #71717a; margin-bottom: 4px; }
    select, input {
      width: 100%;
      padding: 8px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #e4e4e7;
      font-size: 13px;
    }
    select:focus, input:focus { outline: none; border-color: rgba(16,185,129,0.5); }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-green { background: #10b981; color: black; }
    .btn-green:hover { background: #34d399; }
    .btn-red { background: #ef4444; color: white; }
    .btn-red:hover { background: #f87171; }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-blue:hover { background: #60a5fa; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stats {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      margin-top: 8px;
      font-size: 12px;
    }
    .open-eo {
      text-align: center;
      padding: 8px;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #60a5fa;
      cursor: pointer;
    }
    .open-eo:hover { background: rgba(59,130,246,0.2); }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🤖</span>
    <span class="title">Expert<span class="accent">Bot</span></span>
  </div>

  <div id="status" class="status disconnected">
    <span class="dot red"></span>
    <span id="status-text">غير متصل — افتح Expert Option</span>
  </div>

  <div class="open-eo" id="open-eo">🌐 افتح Expert Option</div>

  <div class="field">
    <label>الإستراتيجية</label>
    <select id="strategy">
      <option value="trend">متابعة الاتجاه</option>
      <option value="rsi">مؤشر RSI</option>
      <option value="ma_cross">تقاطع المتوسطات</option>
      <option value="alligator">Alligator</option>
    </select>
  </div>

  <div class="row">
    <div class="field">
      <label>الرهان ($)</label>
      <input type="number" id="amount" value="10" min="1" />
    </div>
    <div class="field">
      <label>المدة (ث)</label>
      <select id="expiry">
        <option value="15">15</option>
        <option value="30" selected>30</option>
        <option value="60">60</option>
        <option value="120">120</option>
      </select>
    </div>
  </div>

  <button class="btn btn-green" id="btn-start">▶ تشغيل البوت</button>
  <button class="btn btn-red" id="btn-stop" style="display:none;">■ إيقاف البوت</button>

  <div class="row">
    <button class="btn btn-green" id="btn-call" style="font-size:12px;">▲ شراء</button>
    <button class="btn btn-red" id="btn-put" style="font-size:12px;">▼ بيع</button>
  </div>

  <div class="stats">
    <span>📊 صفقات: <span id="trades">0</span></span>
    <span id="balance-display">💰 —</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>

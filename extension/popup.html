<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>ExpertBot</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0a0e14;
      color: #e4e4e7;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
    }
    p {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.5;
      margin: 8px 0;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      margin: 12px 0;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .status-text {
      font-size: 12px;
      font-weight: 600;
      color: #10b981;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #10b981;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      text-decoration: none;
      text-align: center;
    }
    .btn:hover {
      background: #34d399;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: #e4e4e7;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
    }
    .field {
      margin-top: 12px;
    }
    .field label {
      display: block;
      font-size: 11px;
      color: #71717a;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 8px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #e4e4e7;
      font-size: 12px;
      box-sizing: border-box;
      font-family: monospace;
    }
    .field input:focus {
      outline: none;
      border-color: rgba(16,185,129,0.5);
    }
    .hint {
      font-size: 10px;
      color: #52525b;
      margin-top: 6px;
      line-height: 1.4;
    }
    .saved-indicator {
      display: none;
      font-size: 10px;
      color: #10b981;
      margin-top: 4px;
    }
    .saved-indicator.show {
      display: block;
    }
    hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">🤖</div>
    <h1>ExpertBot Auto Login</h1>
  </div>

  <div class="status">
    <span class="dot"></span>
    <span class="status-text">الإضافة فعّالة</span>
  </div>

  <p>
    افتح <strong>app.expertoption.com</strong> وسجّل دخولك —
    سيُلتقط التوكن تلقائياً ويُفتح التطبيق جاهزاً للتداول.
  </p>

  <a href="#" id="openApp" target="_blank" class="btn">
    فتح التطبيق
  </a>

  <hr>

  <div class="field">
    <label>رابط التطبيق (Bot URL)</label>
    <input id="appUrl" type="text" placeholder="https://your-domain.com/" dir="ltr" />
    <div class="hint">
      غيّره ليناسب نطاقك عند نشر التطبيق على سيرفر مدفوع.
      الإضافة تعمل مع أي نسخة من التطبيق.
    </div>
    <div class="saved-indicator" id="savedMsg">✓ تم الحفظ</div>
  </div>

  <button class="btn btn-secondary" id="resetBtn" style="margin-top: 8px;">
    استعادة الرابط الافتراضي
  </button>

  <script src="popup.js"></script>
</body>
</html>
